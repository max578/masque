url: https://max578.github.io/masque/

template:
  bootstrap: 5

reference:
- title: Guided masking
  desc: The one-call front door for a table, a folder, or a workbook.
  contents:
  - masque

- title: Role discovery
  desc: Inspect a data frame and decide what each column is and how to mask it.
  contents:
  - propose_roles
  - set_role
  - role_options
  - roles_validate
  - clean_table
  - conform_table

- title: Design detection
  desc: Identify environment scope and experimental design, then visualise both for sanity.
  contents:
  - detect_design
  - plot_design_summary

- title: Masking
  desc: Produce a structurally faithful synthetic clone of one or many tables.
  contents:
  - mask
  - mask_set
  - read_set
  - write_set
  - synthetic
  - recipe

- title: Recipe round-trip
  desc: Persist a recipe and re-target a pipeline between original and synthetic.
  contents:
  - save_recipe
  - read_recipe
  - apply_recipe
  - unmask
  - reveal_maps

- title: Leakage audit
  desc: Check a synthetic for residual structural leakage.
  contents:
  - audit_mask

- title: Geospatial post-processing
  desc: Coarsen or re-anchor synthetic coordinates while keeping them on land and plausible.
  contents:
  - jitter_coordinates
  - synthesise_geospatial

- title: Package
  contents:
  - masque-package

articles:
- title: Get started
  navbar: ~
  contents:
  - getting_started
  - confidentiality
  - recipe_anatomy

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]
